<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base target="_blank">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FizzBuzz</title>
<meta name="description" content="FizzBuzz with rules you can change: pick the count, edit the divisors and words, and watch the grid update.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07070c; --bg2:#0d0d18; --ink:#ece5d2; --dim:#9c947c; --gold:#d8a943; --gold2:#f3d27a; --line:#2a2618; --c0:#d8a943; --c1:#54b8c9; --c2:#9b7fd0; --mix:#f3d27a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.6 "EB Garamond", Georgia, serif; }
  main { max-width:960px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font:800 clamp(28px,6vw,44px)/1.1 Cinzel, serif; letter-spacing:.06em; color:var(--gold2); margin:0 0 6px; }
  .sub { color:var(--dim); font-style:italic; margin:0 0 28px; }
  .controls { display:flex; flex-wrap:wrap; gap:16px 24px; align-items:flex-end; margin-bottom:24px; }
  label { display:block; font:600 12px/1 "IBM Plex Mono", monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; }
  input { font:500 16px/1.2 "IBM Plex Mono", monospace; color:var(--ink); background:var(--bg2); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  input:focus { outline:none; border-color:var(--gold); }
  input[type=number] { width:96px; }
  .rule { display:flex; gap:6px; align-items:center; }
  .rule input.w { width:110px; }
  .rule span { color:var(--dim); font:14px "IBM Plex Mono", monospace; }
  .swatch { width:10px; height:10px; border-radius:2px; flex:none; }
  #stats { color:var(--dim); font:14px "IBM Plex Mono", monospace; margin:0 0 14px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:6px; list-style:none; padding:0; margin:0; }
  #grid li { background:var(--bg2); border:1px solid var(--line); border-radius:5px; padding:8px 6px; text-align:center; font:13px/1.3 "IBM Plex Mono", monospace; overflow-wrap:anywhere; }
  #grid li small { display:block; color:var(--dim); font-size:11px; }
  #grid li.r0 { color:var(--c0); border-color:var(--c0); }
  #grid li.r1 { color:var(--c1); border-color:var(--c1); }
  #grid li.r2 { color:var(--c2); border-color:var(--c2); }
  #grid li.mix { color:var(--bg); background:var(--mix); border-color:var(--mix); font-weight:600; }
  #grid li.mix small { color:var(--bg); }
  a { color:var(--gold2); }
  footer { margin-top:40px; color:var(--dim); font-size:15px; }
</style>
</head>
<body>
<main>
  <h1>FizzBuzz</h1>
  <p class="sub">Multiples of 3 say Fizz, multiples of 5 say Buzz, multiples of both say FizzBuzz. Change the rules and the grid follows.</p>

  <div class="controls">
    <div><label for="count">Count to</label><input id="count" type="number" min="0" max="1000" value="100"></div>
    <div id="rules"></div>
  </div>
  <p id="stats" aria-live="polite"></p>
  <ol id="grid"></ol>

  <footer><a href="https://github.com/bradleyhomelinuxnet-prog/fizzbuzz">Source on GitHub</a> · <a href="https://bradleyhomelinuxnet-prog.github.io/">All projects</a></footer>
</main>
<script type="module">
  import { fizzbuzz } from './src/fizzbuzz.js';
  const $ = (id) => document.getElementById(id);
  // Three editable rules. The third starts empty, so the page opens on the classic game.
  const start = [[3, 'Fizz'], [5, 'Buzz'], ['', 'Bazz']];
  const colors = ['var(--c0)', 'var(--c1)', 'var(--c2)'];

  start.forEach(([d, w], i) => {
    const row = document.createElement('div');
    row.className = 'rule';
    row.innerHTML = `<span class="swatch"></span><input class="d" type="number" min="1" max="999" aria-label="Divisor ${i + 1}"><span>→</span><input class="w" aria-label="Word ${i + 1}">`;
    row.querySelector('.swatch').style.background = colors[i];
    row.querySelector('.d').value = d;
    row.querySelector('.w').value = w;
    if (i === 0) {
      const l = document.createElement('label');
      l.textContent = 'Rules (divisor → word)';
      $('rules').append(l);
    }
    $('rules').append(row);
  });

  function readRules() {
    return [...document.querySelectorAll('.rule')].map((row, i) => ({
      divisor: Number(row.querySelector('.d').value),
      word: row.querySelector('.w').value.trim(),
      i,
    })).filter((r) => Number.isInteger(r.divisor) && r.divisor >= 1 && r.word);
  }

  function render() {
    const count = Math.min(1000, Math.max(0, Math.floor(Number($('count').value) || 0)));
    const rules = readRules();
    const out = fizzbuzz(count, rules);
    const grid = $('grid');
    grid.replaceChildren();
    let words = 0, numbers = 0;
    out.forEach((text, idx) => {
      const n = idx + 1;
      const hits = rules.filter((r) => n % r.divisor === 0);
      const li = document.createElement('li');
      if (hits.length > 1) li.className = 'mix';
      else if (hits.length === 1) li.className = 'r' + hits[0].i;
      li.textContent = text;
      if (hits.length) {
        words++;
        const small = document.createElement('small');
        small.textContent = n;
        li.append(small);
      } else numbers++;
      grid.append(li);
    });
    $('stats').textContent = `${count} numbers · ${words} replaced by words · ${numbers} left as numbers`;
  }

  document.addEventListener('input', render);
  render();
</script>
</body>
</html>
